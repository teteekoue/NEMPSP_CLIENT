name: Build Universal Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare environment files & Google Services
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          # 1. Create .env if not present
          if [ ! -f .env ]; then
            touch .env
          fi

          mkdir -p app

          # 2. Check if a real google-services.json is provided via Secret
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "Decoding GOOGLE_SERVICES_JSON_B64 secret to app/google-services.json..."
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "Secret successfully decoded."
          fi

          # 3. If no google-services.json exists, disable the Google Services task
          # so processDebugGoogleServices never fails or halts the universal APK compilation
          if [ ! -f app/google-services.json ]; then
            echo "No google-services.json provided. Configuring Gradle to skip Google Services processing..."
            echo "tasks.matching { it.name.startsWith('process') && it.name.contains('GoogleServices') }.configureEach { enabled = false }" >> app/build.gradle.kts
          fi

      - name: Ensure Gradle wrapper executable exists
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Universal Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Rename Universal APK
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          
          OUTPUT_DIR="build-artifacts"
          mkdir -p "$OUTPUT_DIR"
          
          FINAL_APK_NAME="NEMPSP-universal-v1.0.apk"
          cp "$APK_PATH" "$OUTPUT_DIR/$FINAL_APK_NAME"
          
          echo "apk_path=$OUTPUT_DIR/$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "APK successfully prepared: $OUTPUT_DIR/$FINAL_APK_NAME"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on tag or main push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          name: NEMPSP Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
